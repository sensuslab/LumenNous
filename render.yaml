services:
  - type: web
    name: lumennous-test
    runtime: docker
    plan: free
    branch: agent/quantum-prayer-music-alignment
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: "3000"
      - key: DEEPSEEK_AI_ENABLED
        value: "true"
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: DEEPSEEK_API_KEY
        sync: false
